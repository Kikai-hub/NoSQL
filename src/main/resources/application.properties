spring.application.name=nosql-users
server.port=8080

# Подключение к MongoDB. Можно переопределить переменной окружения MONGODB_URI
# (например, строкой подключения к MongoDB Atlas).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/netology_users}
# Создавать индексы из аннотаций (@Indexed(unique = true) на email)
spring.data.mongodb.auto-index-creation=true
